[package]
description  = "Treasury contract for the XION network's fee grant infrastructure"
edition      = "2021"
license      = "MIT"
name         = "treasury"
resolver     = "3"
rust-version = "1.86.0"
version      = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# enable feature if you want to disable entry points
library = []

[dependencies]
cosmos-sdk-proto = { package = "xion-cosmos-sdk-proto", version = "0.26.1", default-features = false, features = [
  "std",
  "cosmwasm",
  "xion",
  "serde",
] }
cosmwasm-schema  = "2.2.2"
cosmwasm-std     = { version = "2.2.2", features = ["stargate", "cosmwasm_2_1"] }
cw-storage-plus  = "2.0.0"
cw2              = "2.0.0"
schemars         = "0.8.10"
serde            = { version = "1.0.203", default-features = false, features = ["derive"] }
serde_json       = "1.0.87"
thiserror        = "1"
url              = "2.5.2"

[profile.release]
opt-level       = 3
overflow-checks = true
