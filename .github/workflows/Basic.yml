on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  pull_request:

name: Basic

# Third-party actions are pinned to a commit SHA. This contract is
# governance-deployed against a published checksum, so a moving tag in the
# build path is a supply chain risk. The trailing comment records the human
# readable version each SHA resolves to; update both together.
#
# The rust-toolchain pin must move together with rust-version in Cargo.toml
# and the cosmwasm/optimizer tag in the build job.

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a # 1.86.0
        with:
          targets: wasm32-unknown-unknown

      - name: Run unit tests
        run: cargo test
        env:
          RUST_BACKTRACE: 1

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a # 1.86.0
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build development contracts
        run: |
          docker run --rm -v "${PWD}:/code" cosmwasm/optimizer:0.17.0
